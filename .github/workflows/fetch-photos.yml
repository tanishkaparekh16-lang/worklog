name: fetch-photos
on:
  push:
    branches:
      - claude/anay-tanishka-anniversary-game-fru2m6
    paths:
      - '.github/workflows/fetch-photos.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/anay-tanishka-anniversary-game-fru2m6
      - name: Download attachments
        run: |
          mkdir -p photo-drop
          while read -r n url; do
            curl -sSL --retry 3 --max-time 120 -o "photo-drop/$n.img" "$url" || echo "FAIL $n"
          done < photo-urls.txt
          file photo-drop/*
      - name: Commit photos
        run: |
          git config user.name "photo-fetch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add photo-drop
          git commit -m "Add Blabber reaction photos from issue #1"
          git push
